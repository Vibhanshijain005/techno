<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Server</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            text-align: center;
            padding: 50px;
            background: #1e293b;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            margin-bottom: 25px;
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            background: #14532d;
            color: #4ade80;
            border-radius: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome!</h1>

        <p>Your web server is running successfully.</p>

        <div class="status">
            ● Server Online
        </div>
    </div>

</body>
</html>
